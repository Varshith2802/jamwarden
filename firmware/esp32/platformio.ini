; JamWarden ESP32 firmware
;   pio run                 build
;   pio run -t upload       flash (USB)
;   pio device monitor      watch JSON output (115200 baud)
; The portable detector in ../../core is copied into lib/jamwarden by sync_core.py before every build.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall
extra_scripts = pre:sync_core.py

[env:esp32dev]
board = esp32dev

[env:esp32dev-wifi]
board = esp32dev
build_flags = ${env.build_flags} -DJW_WIFI=1 -DWIFI_SSID=\"your-ssid\" -DWIFI_PASS=\"your-password\"
              -DCOLLECTOR_URL=\"http://192.168.1.10:8050/api/ingest\"

[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DPIN_GNSS_RX=18 -DPIN_GNSS_TX=17 -DPIN_ALARM_LED=-1
